name: Android APK

# Her push'ta ve elle (Actions → Android APK → Run workflow) kurulabilir APK üretir.
# Çıktı, çalıştırma sayfasında "english-study-app-apk" adlı Artifact olarak indirilir.
on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: APK derle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle önbelleği
        uses: gradle/actions/setup-gradle@v4

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Tip kontrolü ve testler (sunucusuz mod dahil)
        run: |
          npm run typecheck --workspace @proje-depom/shared
          npm run typecheck --workspace @proje-depom/mobile-web
          npm test --workspace @proje-depom/shared
          npm test --workspace @proje-depom/mobile-web

      - name: Expo prebuild + Gradle assembleRelease
        env:
          # İsteğe bağlı: depo değişkeni olarak varsayılan sunucu adresi (uygulama içinden de değiştirilebilir).
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: npm run android:apk

      - name: APK'yı imzala ve doğrula
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/sign-android-apk.sh english-study-app.apk

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: english-study-app-apk
          path: english-study-app.apk
          if-no-files-found: error
          retention-days: 30
